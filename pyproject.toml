[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]

[tool.coverage.run]
source = ["scripts"]
omit = ["tests/*"]
concurrency = ["multiprocessing"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
