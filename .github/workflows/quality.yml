name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      COMPANY_WIKI_REPO: ${{ github.workspace }}/.s6-cwp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REVISION }}
      - uses: actions/checkout@v4
        with:
          repository: zhengcb81/company-wiki
          ref: 1a62edf1d0d89567a5a552709d7027880ea3b857
          path: .s6-cwp
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src
            pyproject.toml
            scripts/host_assumption_guard.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install -r references/scheduled-refresh-requirements.txt pytest pyyaml requests beautifulsoup4 lxml openai httpx python-dotenv pymupdf
      - name: Install native process support
        if: matrix.platform == 'windows'
        run: python -m pip install pywin32
      - name: Verify source and public types
        if: matrix.platform == 'linux' && matrix.shard == 0
        run: |
          python -m pip install "ruff==0.15.18" "mypy==1.19.0"
          ruff check scripts tests tools e2e
          python -m compileall -q scripts tests tools e2e
          python -c "import sys; sys.path.insert(0, 'scripts'); import fetch_filing, filing_contracts"
          python tools/complexity_diagnostics.py
          python -m mypy scripts/filing_contracts.py scripts/fetch_filing.py
          python -c "import sys; sys.path.insert(0, 'tools'); import pre_push_gate; sys.exit(pre_push_gate._unique_test_symbols())"
          python tools/verify_plan_claims.py --plan-dir .
      - name: Record canonical offline collection
        if: matrix.shard == 0
        run: >-
          python tools/ci_tests.py --collect-only --evidence s6-inventory-${{ matrix.platform }}.json
          --revision "${{ env.TEST_REVISION }}"
      - name: Run the full offline suite
        run: >-
          python tools/ci_tests.py --evidence s6-executed-${{ matrix.platform }}-${{ matrix.shard }}.json
          --revision "${{ env.TEST_REVISION }}" --shard "${{ matrix.shard }}/3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filing-fetch-test-evidence-${{ matrix.platform }}-${{ matrix.shard }}
          path: s6-*.json
          retention-days: 7
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: verify
    env:
      TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REVISION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: filing-fetch-test-evidence-*
          path: evidence
          merge-multiple: true
      - name: Verify both platforms executed their full collection
        run: >-
          python -m tools.anti_trick_gate_spec coverage --revision "${{ env.TEST_REVISION }}"
          --policy tools/ci_test_policy.json --platform linux --platform windows evidence/*.json
