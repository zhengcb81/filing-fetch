name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest pyyaml requests "mypy==1.19.0"
      - name: "Fetch company-wiki runtime (FC-1101: manifest-driven current triplet)"
        run: |
          git clone --quiet https://github.com/zhengcb81/revenue-forecast.git "$HOME/Projects/revenue-forecast"
          python "$HOME/Projects/revenue-forecast/tools/ci_checkout_siblings.py"             --manifest "$HOME/Projects/revenue-forecast/compatibility/current.json"             --sibling-root "$HOME/Projects" --skip filing
          # FC-1202: revenue's config/filing_fetch.json resolves to
          # ${USER_PROFILE}/Projects/filing-fetch.  The sibling helper skips the
          # repo under test, so mirror the local dev layout explicitly; the
          # doctor then validates the code under test at the configured path.
          rm -rf "$HOME/Projects/filing-fetch"
          ln -s "$GITHUB_WORKSPACE" "$HOME/Projects/filing-fetch"
          echo "PYTHONPATH=$HOME/Projects/company-wiki/src" >> "$GITHUB_ENV"
          echo "FILING_FETCH_V2_WIKI_SRC=$HOME/Projects/company-wiki/src" >> "$GITHUB_ENV"
      - name: Ruff + compileall + import smoke (WU-1.2)
        run: |
          python -m pip install "ruff==0.15.18"
          ruff check scripts tests tools e2e
          python -m compileall -q scripts tests tools e2e
          python -c "import sys; sys.path.insert(0, 'scripts'); import fetch_filing, filing_contracts"
      - name: Complexity maintenance diagnostic (scores never block)
        run: python tools/complexity_diagnostics.py
      - name: Strict type check on public contracts (FC-1204-c)
        run: python -m mypy scripts/filing_contracts.py scripts/fetch_filing.py
      - name: Unique test symbols gate (WU-7.1)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          problems = 0
          for path in sorted(Path('tests').rglob('test_*.py')):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              seen = {}
              def visit(scope):
                  global seen
                  local_seen = {}
                  for node in ast.iter_child_nodes(scope):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith('test_'):
                          if node.name in local_seen:
                              print(f'DUPLICATE {path}:{node.lineno}')
                              global problems
                              problems += 1
                          else:
                              local_seen[node.name] = node.lineno
                      elif isinstance(node, ast.ClassDef):
                          visit(node)
              visit(tree)
          sys.exit(1 if problems else 0)
          PY
      - name: Run focused regression suite once
        run: >-
          python -m pytest
          tests/test_s3_single_request_limits.py
          tests/test_single_intent_acquisition.py
          tests/test_s3_install_surface.py
          tests/test_selective_installation.py
          e2e/test_source_ref_v2_cli.py
          tests/test_ff_v2_contract.py
          tests/test_provider_cause_contract.py
          tests/test_acquisition_failure_consumer.py
          tests/test_ff_golden.py
          tests/test_source_ref_v2.py
          tests/test_source_ref_v2_db_query.py
          tests/test_transcript_companion.py
          tests/test_transcript_companion_transport.py
          tests/test_fetch_filing.py
          tests/test_fc802_gap_orchestration.py
          tests/test_fc1204_coverage_gap.py
          tests/test_p5_process_lifecycle.py
          tests/test_p5_legacy_request_limits.py
          tests/test_complexity_diagnostics.py
          tests/test_verify_plan_claims.py
          tests/test_latest_mode.py
          tests/test_dropbox_config_invariants.py
          tests/test_bundle_compat.py
          tests/e2e_support/test_spy_log.py
          -q --tb=short
      - name: "Config doctor (FC-1202: three-repo contract compatibility)"
        run: python tools/config_doctor.py --revenue-root "$HOME/Projects/revenue-forecast" --require-revenue-config
      - name: Plan claim verifier (WU-8.3)
        run: python tools/verify_plan_claims.py --plan-dir .
