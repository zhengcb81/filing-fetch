name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ~/Projects/company-wiki/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest pyyaml requests
      - name: Fetch company-wiki runtime
        run: |
          mkdir -p ~/Projects
          git clone --depth 1 https://github.com/zhengcb81/company-wiki.git ~/Projects/company-wiki
      - name: Run hermetic test suite
        run: python -m pytest tests -q --tb=short --ignore=tests/test_real_tool_conformance.py --ignore=tests/test_e2e_download.py
      - name: Run full-chain E2E
        run: python e2e/run_filing_fetch_e2e.py
