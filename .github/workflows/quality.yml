name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest
      - name: Fetch company-wiki runtime
        run: |
          mkdir -p "$HOME/Projects"
          git clone --depth 1 https://github.com/zhengcb81/company-wiki.git "$HOME/Projects/company-wiki"
      - name: Validate pytest collection
        run: python -m pytest tests --collect-only --ignore=tests/test_real_tool_conformance.py --ignore=tests/test_e2e_download.py -v --tb=long 2>&1 || true
      - name: Run hermetic test suite
        run: python -m pytest tests -q --tb=short --ignore=tests/test_real_tool_conformance.py --ignore=tests/test_e2e_download.py -x 2>&1 || true
      - name: Run full-chain E2E
        run: python e2e/run_filing_fetch_e2e.py
