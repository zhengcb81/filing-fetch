name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest pyyaml requests
      - name: Fetch company-wiki runtime
        run: |
          mkdir -p "$HOME/Projects"
          git clone --depth 1 https://github.com/zhengcb81/company-wiki.git "$HOME/Projects/company-wiki"
      - name: Diagnose environment
        run: |
          echo "HOME=$HOME"
          ls "$HOME/Projects/company-wiki/src/company_wiki/__init__.py" 2>&1 || echo "company_wiki not found"
          python -c "import sys; sys.path.insert(0, '$HOME/Projects/company-wiki/src'); import company_wiki; print('company_wiki OK:', company_wiki.__file__)"
      - name: Collect tests only
        run: |
          export PYTHONPATH="$HOME/Projects/company-wiki/src"
          python -m pytest tests --collect-only -q --ignore=tests/test_real_tool_conformance.py --ignore=tests/test_e2e_download.py 2>&1 | head -50
          echo "collection exit: $?"
      - name: Run hermetic test suite
        env:
          PYTHONPATH: "${{ github.workspace }}/../company-wiki/src"
        run: python -m pytest tests -v --tb=short --ignore=tests/test_real_tool_conformance.py --ignore=tests/test_e2e_download.py -x 2>&1 | tail -80
      - name: Run full-chain E2E
        env:
          PYTHONPATH: "${{ github.workspace }}/../company-wiki/src"
        run: python e2e/run_filing_fetch_e2e.py
